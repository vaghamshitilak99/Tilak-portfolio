<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilak Vaghamshi | Business Operations & Compliance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1D227C;
            --accent-gold: #F9CC48;
            --bg-cream: #F7F5E9;
            --text-dark: #333333;
            --glass: rgba(255, 255, 255, 0.7);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            margin: 0;
            line-height: 1.6;
        }

        /* Hero Section */
        header {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, var(--primary-blue), #0f124d);
            color: white;
            padding: 20px;
        }

        h1 { font-size: 3.5rem; margin-bottom: 10px; }
        .tagline { font-size: 1.2rem; color: var(--accent-gold); font-weight: 600; text-transform: uppercase; letter-spacing: 2px; }

        /* Navigation Box (Glassmorphism) */
        .glass-nav {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 50px;
            position: fixed;
            top: 20px;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        /* Container & Cards */
        .container { max-width: 1000px; margin: -50px auto 50px; padding: 0 20px; }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }

        .card:hover { transform: translateY(-10px); }

        h2 { color: var(--primary-blue); border-left: 5px solid var(--accent-gold); padding-left: 15px; }

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
